name: Update blog posts

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://jingyuan-zheng.github.io/index.xml"
          max_post_count: 5
          gh_token: ${{ secrets.GITHUB_TOKEN }}
